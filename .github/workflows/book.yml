name: Build book PDF

# Every push that touches the book builds the PDF and keeps it as a workflow artifact.
# Pushing a tag such as v2026.10.25 also publishes the PDF as a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "textbook/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System packages (Pango for WeasyPrint, fallback fonts used in a few figures and code blocks)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core fonts-wqy-zenhei poppler-utils

      - name: Pandoc 3.1.3 (the version the book is built and checked with)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i pandoc-3.1.3-1-amd64.deb
          pandoc --version | head -1

      - name: Python packages
        run: pip install weasyprint==70.0 matplotlib==3.11.2 numpy==2.5.3 pypdf==6.17.0 reportlab==5.0.1

      - name: Figures
        run: python textbook/print/figures.py

      - name: Book
        run: |
          python textbook/print/build.py | tee build.log
          pdfinfo textbook/delivery/understanding-ai_A5_interior.pdf | grep -E "Pages|PDF version"
          if grep -q "MISSING KEYS" build.log; then echo "missing citation keys"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: understanding-ai-pdf
          path: textbook/delivery/understanding-ai_A5_interior.pdf

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp textbook/delivery/understanding-ai_A5_interior.pdf "understanding-ai_${GITHUB_REF_NAME}.pdf"
          PAGES=$(pdfinfo textbook/delivery/understanding-ai_A5_interior.pdf | awk '/^Pages/{print $2}')
          gh release create "$GITHUB_REF_NAME" "understanding-ai_${GITHUB_REF_NAME}.pdf" \
            --title "Understanding AI ($GITHUB_REF_NAME)" \
            --notes "Print-ready A5 interior (PDF/X-4, no bleed), ${PAGES} pages. Built automatically from commit ${GITHUB_SHA::7}."
